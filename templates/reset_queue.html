<!DOCTYPE html>
<html>
<head>
    <title>Reset Queue</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Reset Queue</h1>

    <p>
        To verify Please Enter Reset Password
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Reset Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter reset password"
            required
        >

        <button type="submit">
            Reset All Queue
        </button>

    </form>

    <a href="{{ url_for('dashboard') }}">
        Cancel
    </a>

</div>

</body>
</html>
